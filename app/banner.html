<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
html,body{margin:0;background:transparent;overflow:hidden}
#b{margin:6px;width:348px;border-radius:14px;padding:11px 14px 11px 16px;background:var(--bg,#14161f);color:var(--fg,#e8eaf2);border:1px solid var(--line,#2a2e40);border-left:5px solid var(--acc,#5b6cff);box-shadow:0 8px 28px rgba(0,0,0,.45);cursor:pointer;position:relative;animation:in .22s ease-out}
@keyframes in{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
#t{font-weight:700;font-size:13px;padding-right:18px}
#m{font-size:12px;color:var(--fg2,#b9bdd0);margin-top:3px;line-height:1.35}
#x{position:absolute;top:6px;right:10px;color:var(--fg3,#8b90a8);font-size:14px}
</style></head><body>
<div id="b"><div id="x">✕</div><div id="t"></div><div id="m"></div></div>
<script>
function show(o){
  const r=document.documentElement.style;
  Object.entries(o.theme||{}).forEach(([k,v])=>r.setProperty('--'+k,v));
  document.getElementById('t').textContent=o.title||'';
  document.getElementById('m').textContent=o.body||'';
  const b=document.getElementById('b');b.style.animation='none';void b.offsetWidth;b.style.animation='';
}
document.getElementById('b').onclick=()=>window.bridge.dismiss();
</script></body></html>
